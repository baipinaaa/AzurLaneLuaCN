name: update-lua

# 每 24 小时检查一次 CN（bilibili 服）客户端版本；只有 azhash 变了才真正
# 解包、反编译、构建表、提交。没变化的轮次只做一次 TCP 握手就结束（几百毫秒）。
#
# 不做 actions/cache：增量全部靠 git 里的 `data/manifest.json`（每个 bundle 和
# 每个脚本字节码的 md5 索引）+ `lua/` 里现成的文件 —— checkout 出来就是缓存。
# bundle md5 没变 → 整段跳过；脚本 md5 没变且文件还在 → 不重新反编译。
# 缓存驱逐、换 runner 都不影响，因为增量状态跟着仓库走。

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略版本比对，强制全量重解"
        default: false
        type: boolean
      dry_run:
        description: "只跑不提交（验证用）"
        default: false
        type: boolean

concurrency:
  group: update-lua
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # bcdec / uabdec 是**静态链接**的 32 位 i386 ELF（无 PT_INTERP），
      # 实测在 ubuntu-24.04 上直接就能跑，不需要 libc6:i386。
      - name: 工具链
        run: |
          chmod +x tools/bcdec tools/uabdec
          tools/bcdec </dev/null >/dev/null 2>&1 || echo "bcdec 空输入返回 $? （正常）"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: 版本比对
        id: ver
        run: python scripts/check_version.py --server CN --state data/version.json

      - name: 解包 Lua（scripts32 + sharecfgdata）
        id: unpack
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: |
          # manifest 用默认 data/manifest.json —— 跟随提交，下一轮 checkout
          # 就有上一轮的 md5 索引，bundle/脚本没变就直接跳过
          python scripts/unpack_lua.py \
            --server CN \
            --work .cache/work

      - name: 构建表 JSON
        id: build
        if: steps.ver.outputs.changed == 'true' || inputs.force
        run: |
          python scripts/build_tables.py \
            --lua-dir lua \
            --out tables \
            --server CN

      # 版本状态 + versions/CN.txt 由 unpack_lua.py 在跑完后落盘（写进 data/ 和
      # versions/ 跟随提交），这里不需要额外一步。
      #
      # 只在 status == 'ok' 时提交：
      #   - hard（下载/解密整体失败）      → 不提交，下一轮 cron 自动重试
      #   - 单脚本失败占比 > 2%             → 同样不提交
      #   - 零星脚本 ljd 反编译不了（<2%）→ **照常提交**，缺失记在 data/skipped.json
      - name: 未提交原因
        if: (steps.ver.outputs.changed == 'true' || inputs.force) && steps.unpack.outputs.status != 'ok'
        run: |
          echo "::error::本轮未提交：status=${{ steps.unpack.outputs.status }}，结构性失败 ${{ steps.unpack.outputs.hard }} 项，单脚本跳过 ${{ steps.unpack.outputs.skipped }} 项。详见上方步骤输出。"

      - name: 提交
        if: (steps.ver.outputs.changed == 'true' || inputs.force) && inputs.dry_run != true && steps.unpack.outputs.status == 'ok'
        env:
          PREV: ${{ steps.ver.outputs.prev }}
          NEWVER: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$PREV" ]; then
            MSG="update [CN]: $NEWVER"
          else
            MSG="update [CN]: $PREV -> $NEWVER"
          fi
          echo "提交信息: $MSG"
          python scripts/commit.py --message "$MSG"

      - name: 摘要
        if: always()
        run: echo "本轮结束"